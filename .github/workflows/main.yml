name: Test and Deploy Stack

on:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    branches:
      - main
    tags-ignore:
      - "*"
    paths:
      - ".github/**/*"
      - "cdk/**"
      - "src/**"
      - "cdk.json"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize
    branches:
      - main
    paths:
      - ".github/**/*"
      - "cdk/**"
      - "src/**"
      - "cdk.json"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"

# See https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services#updating-your-github-actions-workflow
permissions:
  id-token: write # required for requesting the JWT
  contents: read # required for actions/checkout

defaults:
  run:
    shell: bash

env:
  UV_LINK_MODE: copy
  UV_NO_PROGRESS: 1

jobs:
  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install tooling and dependencies
        uses: ./.github/actions/install

      - name: Run unit tests
        run: make unit-tests

  integration-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Get commit short SHA
        run: |
          echo "HLS_LPDAAC_STACK_OVERRIDE=test-$(echo ${{ github.sha }} | cut -c 1-7)" >> $GITHUB_ENV

      - name: Convert secrets and vars to environment variables
        shell: python
        run: |
          import os

          secrets_and_vars = {
              **${{ toJson(secrets) }},
              **${{ toJson(vars) }},
          }

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for name, value in secrets_and_vars.items():
                  # If the value contains a newline, use the delimiter syntax
                  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
                  if "\n" in value:
                      print(f"{name}<<EOF\n{value}\nEOF", file=env_file)
                  else:
                      # Standard format for single lines
                      print(f"{name}={value}", file=env_file)

      - name: Deploy integration tests stack
        uses: ./.github/actions/deploy
        with:
          aws_region: "${{ vars.AWS_DEFAULT_REGION }}"
          aws_role_to_assume_arn: "${{ vars.AWS_ROLE_TO_ASSUME_ARN }}"
          aws_role_session_name: "${{ github.actor }}"
          stack_name: "${{ env.HLS_LPDAAC_STACK_OVERRIDE }}"
          command: make deploy-it
          use_actor_email: true

      - name: Run integration tests
        run: make integration-tests

      - name: Destroy integration tests stack
        if: "${{ !cancelled() }}"
        env:
          HLS_LPDAAC_STACK: "${{ env.HLS_LPDAAC_STACK_OVERRIDE }}"
        run: make destroy-it

  deploy-dev:
    # Deploy to Dev only on push (merge) to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Convert secrets and vars to environment variables
        shell: python
        run: |
          import os

          secrets_and_vars = {
              **${{ toJson(secrets) }},
              **${{ toJson(vars) }},
          }

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for name, value in secrets_and_vars.items():
                  # If the value contains a newline, use the delimiter syntax
                  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
                  if "\n" in value:
                      print(f"{name}<<EOF\n{value}\nEOF", file=env_file)
                  else:
                      # Standard format for single lines
                      print(f"{name}={value}", file=env_file)

      - name: Deploy dev stack
        uses: ./.github/actions/deploy
        with:
          aws_region: "${{ vars.AWS_DEFAULT_REGION }}"
          aws_role_to_assume_arn: "${{ vars.AWS_ROLE_TO_ASSUME_ARN }}"
          aws_role_session_name: "${{ github.actor }}"
          command: make deploy

  deploy-prod:
    # Deploy to Prod only on publishing a release (tag)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Convert secrets and vars to environment variables
        shell: python
        run: |
          import os

          secrets_and_vars = {
              **${{ toJson(secrets) }},
              **${{ toJson(vars) }},
          }

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for name, value in secrets_and_vars.items():
                  # If the value contains a newline, use the delimiter syntax
                  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
                  if "\n" in value:
                      print(f"{name}<<EOF\n{value}\nEOF", file=env_file)
                  else:
                      # Standard format for single lines
                      print(f"{name}={value}", file=env_file)

      - name: Deploy production stack
        uses: ./.github/actions/deploy
        with:
          aws_region: "${{ vars.AWS_DEFAULT_REGION }}"
          aws_role_to_assume_arn: "${{ vars.AWS_ROLE_TO_ASSUME_ARN }}"
          aws_role_session_name: "${{ github.actor }}"
          command: make deploy
